<div class="z-[100] w-80 h-[450px] bg-white shadow-lg rounded-t-lg flex flex-col">
  <!-- Header -->
  <div class="flex items-center justify-between border-b border-gray-300 bg-white text-black p-2 rounded-t-lg">
    <!-- Left: avatar + name -->
    <div class="flex items-center gap-2">
      <app-avatar
        [avatarUrl]="popup.profile.avatarUrl"
        [width]="34"
        [height]="34"
        [isOnline]="isOnline"
      ></app-avatar>
      <div class="flex flex-col">
        <span class="font-semibold text-sm">{{ popup.profile.fullName }}</span>
        <span class="text-sm text-gray-500 font-medium">
          {{ isOnline ? 'Đang hoạt động' : 'Ngoại tuyến' }}
        </span>
      </div>
    </div>

    <!-- Right: actions -->
    <div class="flex items-center gap-2 text-lg">
      <!-- sau này có thể thêm nút call/video -->
      <button (click)="onClose(popup)" class="hover:text-gray-200">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="flex-1 p-2 overflow-y-auto">
    <div class="text-sm text-gray-700 mb-1">Xin chào 👋</div>
    <div class="text-sm text-gray-700 mb-1">Bạn khỏe không?</div>
  </div>

  <!-- Input -->
  <div class="p-2 border-t flex gap-2">
    <input type="text" class="flex-1 border rounded-lg px-2" placeholder="Aa" />
    <button class="text-blue-600">Gửi</button>
  </div>
</div>
